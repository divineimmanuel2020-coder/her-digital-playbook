# One-click: (1) colourful Free Tools cards on the homepage, (2) homepage article images that
# load straight away and are pre-warmed on the image server.
# How to run it: GitHub repo -> Actions tab -> "Colour tools and instant images" -> Run workflow.
# Only the look and the image loading change. The tools and articles themselves are untouched.
# It rebuilds every page, checks the result, and only then saves the change.
name: Colour tools and instant images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
