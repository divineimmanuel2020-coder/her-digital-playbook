          node scripts/build.mjs --check
          node scripts/check.mjs

      - name: Save the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Colourful Free Tools cards; homepage article covers load immediately" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_019wdJh4dHRdhsVKkvt3fTsH"
            git push
          fi

      - name: Pre-warm the article images
        continue-on-error: true
        run: |
          # The image host makes each size the first time anyone asks for it, which is the slow part.
          # Ask for every homepage size once now, so real visitors get them instantly.
          grep -oE 'https://res\.cloudinary\.com/[^" ]+' index.html | sort -u > "$RUNNER_TEMP/img-urls.txt"
          echo "Warming $(wc -l < "$RUNNER_TEMP/img-urls.txt") image links"
          for accept in "image/avif,image/webp,image/apng,image/*,*/*;q=0.8" "image/webp,image/*,*/*;q=0.8"; do
            xargs -P 6 -I{} curl -s -o /dev/null -m 90 -w "%{http_code} {}\n" -H "Accept: $accept" {} < "$RUNNER_TEMP/img-urls.txt" | awk '{print $1}' | sort | uniq -c
          done
