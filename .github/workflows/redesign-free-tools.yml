# One-click: redesigns the homepage "Free Tools" section as a clean, modern card grid.
# How to run it: GitHub repo -> Actions tab -> "Redesign free tools section" -> Run workflow.
# Only the look changes: the tools, their links and their logic are untouched.
# It rebuilds every page, checks the result, and only then saves the change.
name: Redesign free tools section

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Redesign the tools section and rebuild the site
