# One-click: AdSense readiness fixes (ads script only where it belongs, complete sitemap,
# meta tags, structured data, stronger Privacy and About pages, calmer newsletter popup).
# How to run it: GitHub repo -> Actions tab -> "AdSense readiness fixes" -> Run workflow.
# It edits the site, rebuilds every page, checks the result, and only then saves the change.
# If any check fails, nothing is changed.
name: AdSense readiness fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

