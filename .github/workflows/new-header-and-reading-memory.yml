# One-click: gives the site its new header, menu, search and "pick up where you left off".
# How to run it: GitHub repo -> Actions tab -> "New header, menu, search and reading memory" -> Run workflow.
# It adds the new files, rebuilds every page, checks the result, and only then saves the change.
# If any check fails, nothing is changed.
name: New header, menu, search and reading memory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the new header and rebuild the site
