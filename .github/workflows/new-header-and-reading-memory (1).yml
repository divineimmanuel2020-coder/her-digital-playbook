          if not os.path.exists('css/style.css') or not os.path.exists('components/header.html'):
              sys.exit("This does not look like the site folder. Nothing changed.")
          if 'HEADER REDESIGN' in rd('css/style.css') and os.path.exists('js/resume.js'):
