<header class="header hdr" id="site-header">
  <div class="hdr-glow" aria-hidden="true"></div>
  <div class="hdr-inner">
    <a class="hdr-brand" href="/" aria-label="Her Digital Playbook, home">
      <img class="hdr-mark" src="/assets/logo-mark.png" alt="" width="58" height="42" decoding="async">
      <span class="hdr-word">
        <span class="hdr-script">Her<span class="hdr-heart" aria-hidden="true">♡</span></span>
        <span class="hdr-caps">Digital Playbook</span>
      </span>
    </a>

    <p class="hdr-tag" aria-hidden="true">Learn <i>·</i> Build <i>·</i> Earn <i>·</i> Elevate</p>

    <div class="hdr-actions">
      <button class="hdr-search" id="search-btn" type="button" aria-label="Search articles and tools" aria-haspopup="dialog">
        <svg class="hdr-search-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="11" r="6.5"></circle><path d="M15.4 15.9 20.5 21"></path><path d="M19.6 2.6l.65 1.75 1.75.65-1.75.65-.65 1.75-.65-1.75-1.75-.65 1.75-.65z" fill="currentColor" stroke="none"></path></svg>
        <span class="hdr-search-text">Search</span>
        <kbd class="hdr-kbd" aria-hidden="true">/</kbd>
      </button>
      <button class="hdr-burger" id="hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-drawer">
        <span class="hdr-burger-lines" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </div>
  </div>
</header>

<div class="hdr-progress" id="hdr-progress" aria-hidden="true"><span></span></div>

<div id="nav-placeholder"></div>

<div class="sx" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search Her Digital Playbook" aria-hidden="true">
  <div class="sx-backdrop" id="search-backdrop"></div>
  <div class="sx-panel">
    <div class="sx-bar">
      <div class="sx-field">
        <svg class="sx-field-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="11" r="6.5"></circle><path d="M15.4 15.9 20.5 21"></path></svg>
        <input type="search" id="search-input" placeholder="Search guides, tools, ideas…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search" aria-controls="search-results">
        <button class="sx-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <button class="sx-close" id="search-close" type="button">Cancel</button>
    </div>
    <div class="sx-tabs" id="search-tabs" role="tablist" aria-label="Filter results" hidden></div>
    <div class="sx-body" id="search-results" role="listbox" aria-label="Search results"></div>
    <div class="sx-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
